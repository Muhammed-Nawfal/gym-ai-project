# Secrets (DB credentials, JWT secret) live in application-secrets.properties, which is gitignored.
spring.config.import=optional:application-secrets.properties

spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# spring.sql.init.mode=always



# Server port
server.port=8080

app.jwtExpirationMs=2592000000

# Origins allowed to call the API from a browser (comma-separated). Native
# apps (Android/iOS) aren't subject to CORS, so this only matters for web.
app.cors.allowed-origins=http://localhost:4173,http://localhost:8081,http://localhost:19006

#file uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.enabled=true

